name: Build Minimal E-AC-3 FFmpeg

on:
  push:
    tags:
      - "eac3-min-*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Windows ──
          - os: windows-latest
            target: windows-x86_64
            upx: true

          - os: windows-latest
            target: windows-arm64
            upx: true
            extra-config: "--target-os=mingw32 --arch=aarch64 --enable-cross-compile"
            pre-configure: |
              export CC="clang --target=aarch64-w64-mingw32"
              export CXX="clang++ --target=aarch64-w64-mingw32"
              export LD="lld-link"
              export AR="llvm-ar"
              export RANLIB="llvm-ranlib"
              # Clang ARM64 体积优化
              export CFLAGS="-Os -fno-asynchronous-unwind-tables -fno-unwind-tables"

          # ── Linux ──
          - os: ubuntu-latest
            target: linux-x86_64
            upx: true
            extra-config: "--extra-cflags=-fvisibility=hidden"

          - os: ubuntu-24.04-arm
            target: linux-arm64
            upx: true
            extra-config: "--extra-cflags=-fvisibility=hidden"

          # ── macOS (不要 UPX —— 会破坏代码签名) ──
          - os: macos-latest
            target: macos-x86_64
            upx: false
            extra-config: "--arch=x86_64 --enable-cross-compile"

          - os: macos-latest
            target: macos-arm64
            upx: false

    steps:
      - uses: actions/checkout@v4

      # ── Install build tools ──
      - name: Install tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y -qq upx-ucl

      - name: Install tools (macOS)
        if: runner.os == 'macOS'
        run: echo "no extra tools needed"

      - name: Install tools (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install upx -y --no-progress
          if [ "${{ matrix.target }}" = "windows-arm64" ]; then
            choco install llvm -y --no-progress --allow-downgrade 2>/dev/null || echo "LLVM already installed"
          fi
        shell: bash

      # ── Configure ──
      - name: Configure FFmpeg
        run: |
          ${{ matrix.pre-configure }}
          if [ "${{ runner.os }}" = "macOS" ]; then
            export MACOSX_DEPLOYMENT_TARGET=11.0
          fi
          ./configure \
            --disable-everything \
            --enable-decoder=eac3 \
            --enable-parser=ac3 \
            --disable-asm \
            --disable-programs \
            --disable-doc \
            --disable-avdevice \
            --disable-avformat \
            --disable-swscale \
            --disable-avfilter \
            --disable-network \
            --disable-encoders \
            --disable-muxers \
            --disable-protocols \
            --disable-filters \
            --enable-small \
            --disable-debug \
            --enable-shared \
            --prefix="$PWD/install" \
            ${{ matrix.extra-config }}
        shell: bash

      # ── Build ──
      - name: Build
        run: |
          make -j$(nproc 2>/dev/null || sysctl -n hw.logicalcpu 2>/dev/null || echo 4)
          # Windows ARM64 的 dlltool 不支持 .lib，手动复制 DLL + strip
          if [ "${{ matrix.target }}" = "windows-arm64" ]; then
            mkdir -p install/bin
            find . \( -name "avcodec-*.dll" -o -name "avutil-*.dll" -o -name "swresample-*.dll" \) ! -name "*.lib" -exec cp {} install/bin/ \;
            llvm-strip install/bin/*.dll 2>/dev/null || strip install/bin/*.dll 2>/dev/null || true
          else
            make install
          fi
        shell: bash

      # ── UPX (Windows + Linux only) ──
      - name: UPX compress
        if: matrix.upx
        run: |
          find install -type f \( -name "*.dll" -o -name "*.so*" \) | while read f; do
            echo "Compressing: $f"
            upx -9 "$f" 2>/dev/null || echo "  (skipped)"
          done
        shell: bash

      # ── Extract thin JNI wrappers from JavaCPP platform JAR ──
      # Downloads the platform JAR from Maven Central, extracts ONLY JNI DLLs
      - name: Fetch JNI wrappers
        run: |
          set -e
          # Map target to JavaCPP platform JAR name
          case "${{ matrix.target }}" in
            windows-x86_64)  JAR="ffmpeg-8.0.1-1.5.13-windows-x86_64.jar" ;;
            windows-arm64)   JAR="ffmpeg-8.0.1-1.5.13-windows-arm64.jar" ;;
            linux-x86_64)    JAR="ffmpeg-8.0.1-1.5.13-linux-x86_64.jar" ;;
            linux-arm64)     JAR="ffmpeg-8.0.1-1.5.13-linux-arm64.jar" ;;
            macos-x86_64)    JAR="ffmpeg-8.0.1-1.5.13-macosx-x86_64.jar" ;;
            macos-arm64)     JAR="ffmpeg-8.0.1-1.5.13-macosx-arm64.jar" ;;
            *) echo "Unknown target"; exit 1 ;;
          esac
          URL="https://repo1.maven.org/maven2/org/bytedeco/ffmpeg/8.0.1-1.5.13/$JAR"
          echo "Downloading JNI wrappers from: $URL"
          curl -sL "$URL" -o platform.jar || wget -q "$URL" -O platform.jar

          # Extract only JNI DLLs (jniavutil, jniavcodec, jniswresample)
          # Ignore the actual FFmpeg DLLs (we have our own smaller ones)
          JNI_DIR="install/jni"
          mkdir -p "$JNI_DIR"
          unzip -qo platform.jar -d "$JNI_DIR" "*/jniav*" "*/jniavcodec*" "*/jniswresample*" 2>/dev/null || true
          
          # Move JNI DLLs to install dir (flatten directory structure)
          find "$JNI_DIR" -type f \( -name "jni*.dll" -o -name "jni*.so" -o -name "jni*.dylib" \) | while read f; do
            mv "$f" "install/$(basename "$f")" 2>/dev/null || true
          done
          rm -rf "$JNI_DIR" platform.jar

          # UPX JNI DLLs too (Windows/Linux only)
          if [ "${{ matrix.upx }}" = "true" ]; then
            find install -type f -name "jni*" | while read f; do
              upx -9 "$f" 2>/dev/null || echo "  JNI UPX skipped: $(basename "$f")"
            done
          fi

          echo "JNI wrappers:"
          find install -type f \( -name "jni*.dll" -o -name "jni*.so" -o -name "jni*.dylib" \) | while read f; do
            size=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f" 2>/dev/null)
            printf "  %-40s %6d bytes\n" "$(basename "$f")" "$size"
          done
        shell: bash

      # ── Show sizes ──
      - name: Show sizes
        run: |
          echo "=== Build artifacts ==="
          find install -type f \( -name "*.dll" -o -name "*.dylib" -o -name "*.so*" \) | while read f; do
            size=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f" 2>/dev/null)
            printf "  %-40s %6d bytes\n" "$(basename "$f")" "$size"
          done
        shell: bash

      # ── Package ──
      - name: Package
        run: |
          mkdir -p dist/${{ matrix.target }}
          find install -type f \( -name "*.dll" -o -name "*.dylib" -o -name "*.so.*" -o -name "jni*" \) | while read f; do
            cp "$f" dist/${{ matrix.target }}/
          done
          find install -type l -name "*.so" | while read f; do
            cp -P "$f" dist/${{ matrix.target }}/ 2>/dev/null || true
          done
          tar czf ffmpeg-eac3-${{ matrix.target }}.tar.gz -C dist ${{ matrix.target }}
        shell: bash

      # ── Upload artifacts ──
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-eac3-${{ matrix.target }}
          path: ffmpeg-eac3-${{ matrix.target }}.tar.gz

  # ── Create release on tag ──
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ffmpeg-eac3-*
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.tar.gz
          fail_on_unmatched_files: true
