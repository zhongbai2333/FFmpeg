name: Build Minimal E-AC-3 FFmpeg

on:
  push:
    tags:
      - "eac3-min-*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Windows ──
          - os: windows-latest
            target: windows-x86_64
            upx: true

          - os: windows-latest
            target: windows-arm64
            upx: true
            extra-config: "--target-os=mingw32 --arch=aarch64 --enable-cross-compile"
            pre-configure: |
              export CC="clang --target=aarch64-w64-mingw32"
              export CXX="clang++ --target=aarch64-w64-mingw32"
              export LD="lld-link"
              export AR="llvm-ar"
              export RANLIB="llvm-ranlib"
              # Clang ARM64 体积优化
              export CFLAGS="-Os -fno-asynchronous-unwind-tables -fno-unwind-tables"

          # ── Linux ──
          - os: ubuntu-latest
            target: linux-x86_64
            upx: true
            extra-config: "--extra-cflags=-fvisibility=hidden"

          - os: ubuntu-24.04-arm
            target: linux-arm64
            upx: true
            extra-config: "--extra-cflags=-fvisibility=hidden"

          # ── macOS (不要 UPX —— 会破坏代码签名) ──
          - os: macos-latest
            target: macos-x86_64
            upx: false
            extra-config: "--arch=x86_64 --enable-cross-compile"
            pre-configure: |
              export CFLAGS="-arch x86_64"
              export LDFLAGS="-arch x86_64"
              export MACOSX_DEPLOYMENT_TARGET=11.0

          - os: macos-latest
            target: macos-arm64
            upx: false

    steps:
      - uses: actions/checkout@v4

      # ── JDK (for JNI headers) ──
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # ── Install build tools ──
      - name: Install tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y -qq upx-ucl

      - name: Install tools (macOS)
        if: runner.os == 'macOS'
        run: echo "no extra tools needed"

      - name: Install tools (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install upx -y --no-progress
          if [ "${{ matrix.target }}" = "windows-arm64" ]; then
            choco install llvm -y --no-progress --allow-downgrade 2>/dev/null || echo "LLVM already installed"
          fi
        shell: bash

      # ── Configure ──
      - name: Configure FFmpeg
        run: |
          ${{ matrix.pre-configure }}
          if [ "${{ runner.os }}" = "macOS" ]; then
            export MACOSX_DEPLOYMENT_TARGET=11.0
          fi
          ./configure \
            --disable-everything \
            --enable-decoder=eac3 \
            --enable-parser=ac3 \
            --disable-asm \
            --disable-programs \
            --disable-doc \
            --disable-avdevice \
            --disable-avformat \
            --disable-swscale \
            --disable-avfilter \
            --disable-network \
            --disable-encoders \
            --disable-muxers \
            --disable-protocols \
            --disable-filters \
            --enable-small \
            --disable-debug \
            --enable-shared \
            --prefix="$PWD/install" \
            ${{ matrix.extra-config }}
        shell: bash

      # ── Build ──
      - name: Build
        run: |
          make -j$(nproc 2>/dev/null || sysctl -n hw.logicalcpu 2>/dev/null || echo 4)
          # Windows ARM64 的 dlltool 不支持 .lib，手动复制 DLL + strip
          if [ "${{ matrix.target }}" = "windows-arm64" ]; then
            mkdir -p install/bin
            find . \( -name "avcodec-*.dll" -o -name "avutil-*.dll" -o -name "swresample-*.dll" \) ! -name "*.lib" -exec cp {} install/bin/ \;
            llvm-strip install/bin/*.dll 2>/dev/null || strip install/bin/*.dll 2>/dev/null || true
          else
            make install
          fi
        shell: bash

      # ── Build thin JNI wrapper (replaces JavaCPP's 800KB+ JNI DLLs) ──
      - name: Build JNI wrapper
        run: |
          set -e
          JNI_OUT="install/bin"
          [ "${{ runner.os }}" != "Windows" ] && JNI_OUT="install/lib"
          mkdir -p "$JNI_OUT"

          case "${{ matrix.target }}" in
            windows-x86_64)
              JNI_NAME="eac3_jni.dll"
              gcc -shared -o "$JNI_OUT/$JNI_NAME" eac3_jni.c \
                -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/win32" \
                -I install/include -L install/bin -lavcodec -lavutil \
                -static-libgcc
              ;;
            windows-arm64)
              JNI_NAME="eac3_jni.dll"
              # 交叉编译环境缺目标平台 stdio.h；用 -DJNI_CROSS_COMPILE + 最小桩
              clang --target=aarch64-w64-mingw32 -shared -DJNI_CROSS_COMPILE \
                -o "$JNI_OUT/$JNI_NAME" eac3_jni.c \
                -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/win32" \
                -I install/include -L install/bin -lavcodec -lavutil
              ;;
            linux-x86_64|linux-arm64)
              JNI_NAME="libeac3_jni.so"
              gcc -shared -o "$JNI_OUT/$JNI_NAME" eac3_jni.c \
                -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
                -I install/include -L install/lib -lavcodec -lavutil
              ;;
            macos-x86_64)
              JNI_NAME="libeac3_jni.dylib"
              gcc -arch x86_64 -mmacosx-version-min=11.0 -shared -o "$JNI_OUT/$JNI_NAME" eac3_jni.c \
                -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/darwin" \
                -I install/include -L install/lib -lavcodec -lavutil
              ;;
            macos-arm64)
              JNI_NAME="libeac3_jni.dylib"
              gcc -shared -o "$JNI_OUT/$JNI_NAME" eac3_jni.c \
                -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/darwin" \
                -I install/include -L install/lib -lavcodec -lavutil
              ;;
          esac

          # UPX the JNI wrapper too (Windows/Linux only)
          if [ "${{ matrix.upx }}" = "true" ]; then
            upx -9 "$JNI_OUT/$JNI_NAME" 2>/dev/null || echo "  JNI UPX skipped"
          fi

          printf "  %-40s %6d bytes\n" "$JNI_NAME" $(stat -c%s "$JNI_OUT/$JNI_NAME" 2>/dev/null || stat -f%z "$JNI_OUT/$JNI_NAME" 2>/dev/null)
        shell: bash

      # ── UPX (Windows + Linux only) ──
      - name: UPX compress
        if: matrix.upx
        run: |
          find install -type f \( -name "*.dll" -o -name "*.so*" \) | while read f; do
            echo "Compressing: $f"
            upx -9 "$f" 2>/dev/null || echo "  (skipped)"
          done
        shell: bash

      # ── Show sizes ──
      - name: Show sizes
        run: |
          echo "=== Build artifacts ==="
          find install -type f \( -name "*.dll" -o -name "*.dylib" -o -name "*.so*" \) | while read f; do
            size=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f" 2>/dev/null)
            printf "  %-40s %6d bytes\n" "$(basename "$f")" "$size"
          done
        shell: bash

      # ── Package ──
      - name: Package
        run: |
          mkdir -p dist/${{ matrix.target }}
          find install -type f \( -name "*.dll" -o -name "*.dylib" -o -name "*.so.*" -o -name "*eac3_jni*" \) ! -name "*.h" | while read f; do
            cp "$f" dist/${{ matrix.target }}/
          done
          find install -type l -name "*.so" | while read f; do
            cp -P "$f" dist/${{ matrix.target }}/ 2>/dev/null || true
          done
          tar czf ffmpeg-eac3-${{ matrix.target }}.tar.gz -C dist ${{ matrix.target }}
        shell: bash

      # ── Upload artifacts ──
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-eac3-${{ matrix.target }}
          path: ffmpeg-eac3-${{ matrix.target }}.tar.gz

  # ── Create release on tag ──
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ffmpeg-eac3-*
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.tar.gz
          fail_on_unmatched_files: true
