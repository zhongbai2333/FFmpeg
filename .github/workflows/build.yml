name: Build Minimal E-AC-3 FFmpeg

on:
  push:
    tags:
      - "eac3-min-*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Windows ──
          - os: windows-latest
            target: windows-x86_64
            upx: true
            extra-config: "--enable-w32threads --disable-pthreads --extra-ldflags='-static-libgcc -static-libstdc++' --pkg-config-flags='--static'"

          - os: windows-11-arm
            target: windows-arm64
            upx: true
            extra-config: "--enable-w32threads --disable-pthreads --extra-ldflags='-static-libgcc -static-libstdc++' --pkg-config-flags='--static'"

          # ── Linux ──
          - os: ubuntu-latest
            target: linux-x86_64
            upx: true
            extra-config: "--extra-cflags=-fvisibility=hidden"

          - os: ubuntu-24.04-arm
            target: linux-arm64
            upx: true
            extra-config: "--extra-cflags=-fvisibility=hidden"

          # ── macOS (不要 UPX —— 会破坏代码签名) ──
          - os: macos-latest
            target: macos-x86_64
            upx: false
            extra-config: "--arch=x86_64 --target-os=darwin --enable-cross-compile --extra-cflags='-arch x86_64 -mmacosx-version-min=11.0' --extra-ldflags='-arch x86_64 -mmacosx-version-min=11.0'"
            pre-configure: |
              export CC="clang -arch x86_64"
              export CXX="clang++ -arch x86_64"
              export CFLAGS="-arch x86_64 -mmacosx-version-min=11.0"
              export LDFLAGS="-arch x86_64 -mmacosx-version-min=11.0"
              export MACOSX_DEPLOYMENT_TARGET=11.0

          - os: macos-latest
            target: macos-arm64
            upx: false

    steps:
      - uses: actions/checkout@v4

      # ── JDK (for JNI headers) ──
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # ── Install build tools ──
      - name: Install tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y -qq upx-ucl

      - name: Install tools (macOS)
        if: runner.os == 'macOS'
        run: echo "no extra tools needed"

      - name: Install tools (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install upx -y --no-progress
        shell: bash

      # ── Configure ──
      - name: Configure FFmpeg
        run: |
          ${{ matrix.pre-configure }}
          if [ "${{ runner.os }}" = "macOS" ]; then
            export MACOSX_DEPLOYMENT_TARGET=11.0
          fi
          ./configure \
            --disable-everything \
            --enable-decoder=eac3 \
            --enable-parser=ac3 \
            --disable-asm \
            --disable-programs \
            --disable-doc \
            --disable-avdevice \
            --disable-avformat \
            --disable-swscale \
            --disable-avfilter \
            --disable-network \
            --disable-encoders \
            --disable-muxers \
            --disable-protocols \
            --disable-filters \
            --enable-small \
            --disable-debug \
            --enable-shared \
            --prefix="$PWD/install" \
            ${{ matrix.extra-config }}
          echo "=== Configured threading model ==="
          grep -E 'THREADS|PTHREAD|W32THREAD' ffbuild/config.mak || true
        shell: bash

      # ── Force-remove pthread from MinGW toolchain (Windows only) ──
      - name: Strip pthread linkage (Windows)
        if: runner.os == 'Windows'
        run: |
          set -e
          echo "=== Before ==="
          grep -nE 'lwinpthread|lpthread|pthread' ffbuild/config.mak || echo "(none)"
          # Kill any -lwinpthread / -lpthread from every linker variable
          sed -i.bak \
            -e 's/-lwinpthread//g' \
            -e 's/-lpthread//g' \
            -e 's/-pthread//g' \
            ffbuild/config.mak
          # Kill HAVE_PTHREADS / HAVE_WINPTHREAD so code won't use them
          sed -i.bak \
            -e 's/#define HAVE_PTHREADS .*/#define HAVE_PTHREADS 0/' \
            -e 's/#define HAVE_WINPTHREAD .*/#define HAVE_WINPTHREAD 0/' \
            -e 's/#define HAVE_PTHREAD_CANCEL .*/#define HAVE_PTHREAD_CANCEL 0/' \
            config.h || true
          echo "=== After ==="
          grep -nE 'lwinpthread|lpthread|HAVE_PTHREAD|HAVE_WINPTHREAD' ffbuild/config.mak config.h || echo "(clean)"
        shell: bash

      # ── Build ──
      - name: Build
        run: |
          make -j$(nproc 2>/dev/null || sysctl -n hw.logicalcpu 2>/dev/null || echo 4)
          make install
        shell: bash

      # ── Build thin JNI wrapper (replaces JavaCPP's 800KB+ JNI DLLs) ──
      - name: Build JNI wrapper
        run: |
          set -e
          JNI_OUT="install/bin"
          [ "${{ runner.os }}" != "Windows" ] && JNI_OUT="install/lib"
          mkdir -p "$JNI_OUT"

          case "${{ matrix.target }}" in
            windows-x86_64|windows-arm64)
              JNI_NAME="eac3_jni.dll"
              gcc -shared -o "$JNI_OUT/$JNI_NAME" eac3_jni.c \
                -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/win32" \
                -I install/include -L install/lib -L install/bin -lavcodec -lavutil \
                -static-libgcc
              ;;
            linux-x86_64|linux-arm64)
              JNI_NAME="libeac3_jni.so"
              gcc -shared -o "$JNI_OUT/$JNI_NAME" eac3_jni.c \
                -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
                -I install/include -L install/lib -lavcodec -lavutil
              ;;
            macos-x86_64)
              JNI_NAME="libeac3_jni.dylib"
              gcc -arch x86_64 -mmacosx-version-min=11.0 -shared -o "$JNI_OUT/$JNI_NAME" eac3_jni.c \
                -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/darwin" \
                -I install/include -L install/lib -lavcodec -lavutil
              ;;
            macos-arm64)
              JNI_NAME="libeac3_jni.dylib"
              gcc -shared -o "$JNI_OUT/$JNI_NAME" eac3_jni.c \
                -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/darwin" \
                -I install/include -L install/lib -lavcodec -lavutil
              ;;
          esac

          # UPX the JNI wrapper too (Windows/Linux only)
          if [ "${{ matrix.upx }}" = "true" ]; then
            upx -9 "$JNI_OUT/$JNI_NAME" 2>/dev/null || echo "  JNI UPX skipped"
          fi

          printf "  %-40s %6d bytes\n" "$JNI_NAME" $(stat -c%s "$JNI_OUT/$JNI_NAME" 2>/dev/null || stat -f%z "$JNI_OUT/$JNI_NAME" 2>/dev/null)
        shell: bash

      # ── Bundle Windows runtime dependencies ──
      - name: Bundle Windows runtime dependencies
        if: runner.os == 'Windows'
        run: |
          set -e
          mkdir -p install/bin

          find_dll() {
            name="$1"
            candidate="$(where.exe "$name" 2>/dev/null | tr -d '\r' | head -n 1 || true)"
            if [ -n "$candidate" ]; then
              candidate="$(cygpath -u "$candidate" 2>/dev/null || echo "$candidate")"
              if [ -f "$candidate" ]; then
                echo "$candidate"
                return 0
              fi
            fi

            for root in /mingw64 /ucrt64 /clang64 /clangarm64 /usr /c/ProgramData/chocolatey/lib; do
              [ -d "$root" ] || continue
              candidate="$(find "$root" -type f -iname "$name" 2>/dev/null | head -n 1 || true)"
              if [ -n "$candidate" ]; then
                echo "$candidate"
                return 0
              fi
            done
            return 1
          }

          dep="$(find_dll libwinpthread-1.dll || true)"
          if [ -z "$dep" ]; then
            echo "::error::avutil imports libwinpthread-1.dll, but the matching runtime DLL was not found in PATH/toolchain."
            exit 1
          fi

          cp "$dep" install/bin/libwinpthread-1.dll
          echo "Bundled libwinpthread-1.dll from: $dep"
        shell: bash

      # ── Windows dependency audit ──
      - name: Audit Windows DLL dependencies
        if: runner.os == 'Windows'
        run: |
          python - <<'PY'
          import pathlib
          import struct
          import sys

          FORBIDDEN = {
              "libgcc_s_seh-1.dll",
              "libgcc_s_dw2-1.dll",
              "libstdc++-6.dll",
          }
          BUNDLED = {
              "libwinpthread-1.dll",
          }

          def rva_to_off(sections, rva):
              for va, vsz, raw, rawsz in sections:
                  if va <= rva < va + max(vsz, rawsz):
                      return raw + (rva - va)
              return None

          def imports(path):
              data = path.read_bytes()
              if data[:2] != b"MZ":
                  return []
              pe = struct.unpack_from("<I", data, 0x3C)[0]
              if data[pe:pe + 4] != b"PE\0\0":
                  return []
              coff = pe + 4
              _, sections_count, _, _, _, opt_size, _ = struct.unpack_from("<HHIIIHH", data, coff)
              opt = coff + 20
              magic = struct.unpack_from("<H", data, opt)[0]
              if magic == 0x20B:
                  data_dirs = opt + 112
              elif magic == 0x10B:
                  data_dirs = opt + 96
              else:
                  return []
              import_rva, _ = struct.unpack_from("<II", data, data_dirs + 8)
              if import_rva == 0:
                  return []

              section_table = opt + opt_size
              sections = []
              for i in range(sections_count):
                  header = section_table + i * 40
                  vsz, va, rawsz, raw = struct.unpack_from("<IIII", data, header + 8)
                  sections.append((va, vsz, raw, rawsz))

              import_off = rva_to_off(sections, import_rva)
              if import_off is None:
                  return []

              result = []
              for i in range(512):
                  desc = import_off + i * 20
                  if desc + 20 > len(data):
                      break
                  values = struct.unpack_from("<IIIII", data, desc)
                  if values == (0, 0, 0, 0, 0):
                      break
                  name_off = rva_to_off(sections, values[3])
                  if name_off is None:
                      continue
                  end = data.find(b"\0", name_off)
                  if end > name_off:
                      result.append(data[name_off:end].decode("ascii", "replace"))
              return result

          bundled_present = {p.name.lower() for p in pathlib.Path("install").rglob("*.dll")}
          bad = []
          missing_bundled = []
          for dll in sorted(pathlib.Path("install").rglob("*.dll")):
              imported = imports(dll)
              print(f"{dll}:")
              for name in imported:
                  print(f"  {name}")
              forbidden = sorted(name for name in imported if name.lower() in FORBIDDEN)
              if forbidden:
                  bad.append((dll, forbidden))
              for name in imported:
                  lowered = name.lower()
                  if lowered in BUNDLED and lowered not in bundled_present:
                      missing_bundled.append((dll, name))

          if bad or missing_bundled:
              if bad:
                  print("::error::Forbidden MinGW runtime dependencies found:")
                  for dll, deps in bad:
                      print(f"  {dll}: {', '.join(deps)}")
              if missing_bundled:
                  print("::error::Bundled runtime dependencies are imported but missing from install output:")
                  for dll, dep in missing_bundled:
                      print(f"  {dll}: {dep}")
              sys.exit(1)

          if BUNDLED & bundled_present:
              print("Bundled runtime dependencies:")
              for name in sorted(BUNDLED & bundled_present):
                  print(f"  {name}")
          else:
              print("No bundled Windows runtime dependencies required.")
          PY
        shell: bash

      # ── UPX (Windows + Linux only) ──
      - name: UPX compress
        if: matrix.upx
        run: |
          find install -type f \( -name "*.dll" -o -name "*.so*" \) | while read f; do
            case "$(basename "$f")" in
              libwinpthread-1.dll)
                echo "Skipping runtime DLL: $f"
                continue
                ;;
            esac
            echo "Compressing: $f"
            upx -9 "$f" 2>/dev/null || echo "  (skipped)"
          done
        shell: bash

      # ── Show sizes ──
      - name: Show sizes
        run: |
          echo "=== Build artifacts ==="
          find install -type f \( -name "*.dll" -o -name "*.dylib" -o -name "*.so*" \) | while read f; do
            size=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f" 2>/dev/null)
            printf "  %-40s %6d bytes\n" "$(basename "$f")" "$size"
          done
        shell: bash

      # ── Package ──
      - name: Package
        run: |
          mkdir -p dist/${{ matrix.target }}
          find install -type f \( -name "*.dll" -o -name "*.dylib" -o -name "*.so.*" -o -name "*eac3_jni*" \) ! -name "*.h" | while read f; do
            cp "$f" dist/${{ matrix.target }}/
          done
          find install -type l -name "*.so" | while read f; do
            cp -P "$f" dist/${{ matrix.target }}/ 2>/dev/null || true
          done
          tar czf ffmpeg-eac3-${{ matrix.target }}.tar.gz -C dist ${{ matrix.target }}
        shell: bash

      # ── Upload artifacts ──
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-eac3-${{ matrix.target }}
          path: ffmpeg-eac3-${{ matrix.target }}.tar.gz

  # ── Create release on tag ──
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ffmpeg-eac3-*
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.tar.gz
          fail_on_unmatched_files: true
