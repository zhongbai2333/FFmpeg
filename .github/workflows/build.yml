name: Build Minimal Media FFmpeg

on:
  push:
    tags:
      - "media-min-*"
      - "eac3-min-*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Windows ──
          - os: windows-latest
            target: windows-x86_64
            upx: true
            extra-config: "--enable-w32threads --disable-pthreads --enable-hwaccel=h264_d3d11va --enable-hwaccel=h264_d3d11va2 --enable-hwaccel=hevc_d3d11va --enable-hwaccel=hevc_d3d11va2 --enable-hwaccel=h264_dxva2 --enable-hwaccel=hevc_dxva2 --extra-ldflags='-static-libgcc -static-libstdc++' --pkg-config-flags='--static'"

          - os: windows-11-arm
            target: windows-arm64
            upx: true
            extra-config: "--enable-w32threads --disable-pthreads --enable-hwaccel=h264_d3d11va --enable-hwaccel=h264_d3d11va2 --enable-hwaccel=hevc_d3d11va --enable-hwaccel=hevc_d3d11va2 --enable-hwaccel=h264_dxva2 --enable-hwaccel=hevc_dxva2 --extra-ldflags='-static-libgcc -static-libstdc++' --pkg-config-flags='--static'"

          # ── Linux ──
          - os: ubuntu-latest
            target: linux-x86_64
            upx: false
            extra-config: ""

          - os: ubuntu-24.04-arm
            target: linux-arm64
            upx: false
            extra-config: ""

          # ── macOS (不要 UPX —— 会破坏代码签名) ──
          - os: macos-latest
            target: macos-x86_64
            upx: false
            extra-config: "--arch=x86_64 --target-os=darwin --enable-cross-compile --enable-hwaccel=h264_videotoolbox --enable-hwaccel=hevc_videotoolbox --extra-cflags='-arch x86_64 -mmacosx-version-min=11.0' --extra-ldflags='-arch x86_64 -mmacosx-version-min=11.0'"
            pre-configure: |
              export CC="clang -arch x86_64"
              export CXX="clang++ -arch x86_64"
              export CFLAGS="-arch x86_64 -mmacosx-version-min=11.0"
              export LDFLAGS="-arch x86_64 -mmacosx-version-min=11.0"
              export MACOSX_DEPLOYMENT_TARGET=11.0

          - os: macos-latest
            target: macos-arm64
            upx: false
            extra-config: "--enable-hwaccel=h264_videotoolbox --enable-hwaccel=hevc_videotoolbox"

    steps:
      - uses: actions/checkout@v4

      # ── JDK (for JNI headers) ──
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # ── Install build tools ──
      - name: Install tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y -qq
          sudo apt-get install -y -qq make gcc pkg-config binutils

      - name: Install tools (macOS)
        if: runner.os == 'macOS'
        run: echo "no extra tools needed"

      - name: Install tools (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install upx -y --no-progress
        shell: bash

      # ── Configure ──
      - name: Configure FFmpeg
        run: |
          ${{ matrix.pre-configure }}
          if [ "${{ runner.os }}" = "macOS" ]; then
            export MACOSX_DEPLOYMENT_TARGET=11.0
          fi
          ./configure \
            --disable-everything \
            --enable-decoder=eac3 \
            --enable-decoder=h264 \
            --enable-decoder=hevc \
            --enable-parser=ac3 \
            --enable-parser=h264 \
            --enable-parser=hevc \
            --enable-bsf=h264_mp4toannexb \
            --enable-bsf=hevc_mp4toannexb \
            --enable-swscale \
            --disable-asm \
            --disable-programs \
            --disable-doc \
            --disable-avdevice \
            --disable-avformat \
            --disable-avfilter \
            --disable-network \
            --disable-encoders \
            --disable-muxers \
            --disable-protocols \
            --disable-filters \
            --enable-small \
            --disable-debug \
            --enable-shared \
            --prefix="$PWD/install" \
            ${{ matrix.extra-config }}
          echo "=== Configured threading model ==="
          grep -E 'THREADS|PTHREAD|W32THREAD' ffbuild/config.mak || true
          echo "=== Enabled decoders/parsers/bsfs/hwaccels ==="
          grep -E 'CONFIG_(EAC3|H264|HEVC|ITUT_T35|AC3|H264_MP4TOANNEXB|HEVC_MP4TOANNEXB|SWSCALE|H264_D3D11VA|H264_D3D11VA2|HEVC_D3D11VA|HEVC_D3D11VA2|H264_DXVA2|HEVC_DXVA2|H264_VAAPI|HEVC_VAAPI|H264_VIDEOTOOLBOX|HEVC_VIDEOTOOLBOX)' config.h || true
        shell: bash

      # ── Force-remove pthread from MinGW toolchain (Windows only) ──
      - name: Strip pthread linkage (Windows)
        if: runner.os == 'Windows'
        run: |
          set -e
          echo "=== Before ==="
          grep -nE 'lwinpthread|lpthread|pthread' ffbuild/config.mak || echo "(none)"
          sed -i.bak \
            -e 's/-lwinpthread//g' \
            -e 's/-lpthread//g' \
            -e 's/-pthread//g' \
            ffbuild/config.mak
          sed -i.bak \
            -e 's/#define HAVE_PTHREADS .*/#define HAVE_PTHREADS 0/' \
            -e 's/#define HAVE_WINPTHREAD .*/#define HAVE_WINPTHREAD 0/' \
            -e 's/#define HAVE_PTHREAD_CANCEL .*/#define HAVE_PTHREAD_CANCEL 0/' \
            config.h || true
          echo "=== After ==="
          grep -nE 'lwinpthread|lpthread|HAVE_PTHREAD|HAVE_WINPTHREAD' ffbuild/config.mak config.h || echo "(clean)"
        shell: bash

      # ── Build ──
      - name: Build
        run: |
          make -j$(nproc 2>/dev/null || sysctl -n hw.logicalcpu 2>/dev/null || echo 4)
          make install
        shell: bash

      # ── Build thin JNI wrappers ──
      - name: Build JNI wrappers
        run: |
          set -e
          JNI_OUT="install/bin"
          [ "${{ runner.os }}" != "Windows" ] && JNI_OUT="install/lib"
          mkdir -p "$JNI_OUT"

          case "${{ matrix.target }}" in
            windows-x86_64|windows-arm64)
              gcc -shared -o "$JNI_OUT/eac3_jni.dll" eac3_jni.c \
                -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/win32" \
                -I install/include -L install/lib -L install/bin -lavcodec -lavutil \
                -static-libgcc
              gcc -shared -o "$JNI_OUT/video_jni.dll" video_jni.c \
                -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/win32" \
                -I install/include -L install/lib -L install/bin -lavcodec -lswscale -lavutil \
                -static-libgcc
              ;;
            linux-x86_64|linux-arm64)
              gcc -shared -o "$JNI_OUT/libeac3_jni.so" eac3_jni.c \
                -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
                -I install/include -L install/lib \
                -Wl,--no-undefined -Wl,-rpath,'$ORIGIN' \
                -lavcodec -lavutil
              gcc -shared -o "$JNI_OUT/libvideo_jni.so" video_jni.c \
                -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
                -I install/include -L install/lib \
                -Wl,--no-undefined -Wl,-rpath,'$ORIGIN' \
                -lavcodec -lswscale -lavutil
              ;;
            macos-x86_64)
              gcc -arch x86_64 -mmacosx-version-min=11.0 -shared -o "$JNI_OUT/libeac3_jni.dylib" eac3_jni.c \
                -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/darwin" \
                -I install/include -L install/lib -lavcodec -lavutil
              gcc -arch x86_64 -mmacosx-version-min=11.0 -shared -o "$JNI_OUT/libvideo_jni.dylib" video_jni.c \
                -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/darwin" \
                -I install/include -L install/lib -lavcodec -lswscale -lavutil
              ;;
            macos-arm64)
              gcc -shared -o "$JNI_OUT/libeac3_jni.dylib" eac3_jni.c \
                -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/darwin" \
                -I install/include -L install/lib -lavcodec -lavutil
              gcc -shared -o "$JNI_OUT/libvideo_jni.dylib" video_jni.c \
                -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/darwin" \
                -I install/include -L install/lib -lavcodec -lswscale -lavutil
              ;;
          esac

          if [ "${{ matrix.upx }}" = "true" ]; then
            find "$JNI_OUT" -type f \( -name "*.dll" -o -name "*.so" \) | while read f; do
              upx -9 "$f" 2>/dev/null || echo "  JNI UPX skipped: $f"
            done
          fi

          find "$JNI_OUT" -type f \( -name "*eac3_jni*" -o -name "*video_jni*" \) | while read f; do
            printf "  %-40s %6d bytes\n" "$(basename "$f")" $(stat -c%s "$f" 2>/dev/null || stat -f%z "$f" 2>/dev/null)
          done
        shell: bash

      # ── Linux ELF audit: fail fast before packaging broken hidden-symbol libraries ──
      - name: Audit Linux ELF symbols
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          libdir="install/lib"

          require_export() {
            lib="$1"
            symbol="$2"
            if ! readelf --dyn-syms --wide "$libdir/$lib" | grep -q " $symbol@@\| $symbol$"; then
              echo "::error::$lib does not export required dynamic symbol: $symbol"
              readelf -d "$libdir/$lib" || true
              readelf --dyn-syms --wide "$libdir/$lib" | head -80 || true
              exit 1
            fi
          }

          require_needed() {
            lib="$1"
            needed="$2"
            if ! readelf -d "$libdir/$lib" | grep -q "Shared library: \[$needed"; then
              echo "::error::$lib is missing DT_NEEDED entry for $needed"
              readelf -d "$libdir/$lib" || true
              objdump -T "$libdir/$lib" | grep -E 'avcodec|avutil|sws_' || true
              exit 1
            fi
          }

          require_export libavutil.so.60 av_buffer_allocz
          require_export libavcodec.so.62 avcodec_send_packet
          require_export libswscale.so.9 sws_scale

          require_needed libeac3_jni.so libavcodec.so.62
          require_needed libeac3_jni.so libavutil.so.60
          require_needed libvideo_jni.so libavcodec.so.62
          require_needed libvideo_jni.so libavutil.so.60
          require_needed libvideo_jni.so libswscale.so.9

          for lib in libavutil.so.60 libavcodec.so.62 libswscale.so.9 libeac3_jni.so libvideo_jni.so; do
            echo "=== $lib dynamic section ==="
            readelf -d "$libdir/$lib" | grep -E 'NEEDED|SONAME|RPATH|RUNPATH' || true
            echo "=== $lib key symbols ==="
            objdump -T "$libdir/$lib" | grep -E 'av_buffer_allocz|avcodec_send_packet|avcodec_receive_frame|avcodec_flush_buffers|sws_scale|Java_com_' || true
          done
        shell: bash

      # ── Bundle Windows runtime dependencies ──
      - name: Bundle Windows runtime dependencies
        if: runner.os == 'Windows'
        run: |
          set -e
          mkdir -p install/bin

          find_dll() {
            name="$1"
            candidate="$(where.exe "$name" 2>/dev/null | tr -d '\r' | head -n 1 || true)"
            if [ -n "$candidate" ]; then
              candidate="$(cygpath -u "$candidate" 2>/dev/null || echo "$candidate")"
              if [ -f "$candidate" ]; then
                echo "$candidate"
                return 0
              fi
            fi

            for root in /mingw64 /ucrt64 /clang64 /clangarm64 /usr /c/ProgramData/chocolatey/lib; do
              [ -d "$root" ] || continue
              candidate="$(find "$root" -type f -iname "$name" 2>/dev/null | head -n 1 || true)"
              if [ -n "$candidate" ]; then
                echo "$candidate"
                return 0
              fi
            done
            return 1
          }

          dep="$(find_dll libwinpthread-1.dll || true)"
          if [ -n "$dep" ]; then
            cp "$dep" install/bin/libwinpthread-1.dll
            echo "Bundled libwinpthread-1.dll from: $dep"
          else
            echo "No libwinpthread-1.dll found/needed."
          fi
        shell: bash

      # ── Windows dependency audit ──
      - name: Audit Windows DLL dependencies
        if: runner.os == 'Windows'
        run: |
          python - <<'PY'
          import pathlib
          import struct
          import sys

          FORBIDDEN = {
              "libgcc_s_seh-1.dll",
              "libgcc_s_dw2-1.dll",
              "libstdc++-6.dll",
          }
          BUNDLED = {
              "libwinpthread-1.dll",
          }

          def rva_to_off(sections, rva):
              for va, vsz, raw, rawsz in sections:
                  if va <= rva < va + max(vsz, rawsz):
                      return raw + (rva - va)
              return None

          def imports(path):
              data = path.read_bytes()
              if data[:2] != b"MZ":
                  return []
              pe = struct.unpack_from("<I", data, 0x3C)[0]
              if data[pe:pe + 4] != b"PE\0\0":
                  return []
              coff = pe + 4
              _, sections_count, _, _, _, opt_size, _ = struct.unpack_from("<HHIIIHH", data, coff)
              opt = coff + 20
              magic = struct.unpack_from("<H", data, opt)[0]
              if magic == 0x20B:
                  data_dirs = opt + 112
              elif magic == 0x10B:
                  data_dirs = opt + 96
              else:
                  return []
              import_rva, _ = struct.unpack_from("<II", data, data_dirs + 8)
              if import_rva == 0:
                  return []

              section_table = opt + opt_size
              sections = []
              for i in range(sections_count):
                  header = section_table + i * 40
                  vsz, va, rawsz, raw = struct.unpack_from("<IIII", data, header + 8)
                  sections.append((va, vsz, raw, rawsz))

              import_off = rva_to_off(sections, import_rva)
              if import_off is None:
                  return []

              result = []
              for i in range(512):
                  desc = import_off + i * 20
                  if desc + 20 > len(data):
                      break
                  values = struct.unpack_from("<IIIII", data, desc)
                  if values == (0, 0, 0, 0, 0):
                      break
                  name_off = rva_to_off(sections, values[3])
                  if name_off is None:
                      continue
                  end = data.find(b"\0", name_off)
                  if end > name_off:
                      result.append(data[name_off:end].decode("ascii", "replace"))
              return result

          bundled_present = {p.name.lower() for p in pathlib.Path("install").rglob("*.dll")}
          bad = []
          missing_bundled = []
          for dll in sorted(pathlib.Path("install").rglob("*.dll")):
              imported = imports(dll)
              print(f"{dll}:")
              for name in imported:
                  print(f"  {name}")
              forbidden = sorted(name for name in imported if name.lower() in FORBIDDEN)
              if forbidden:
                  bad.append((dll, forbidden))
              for name in imported:
                  lowered = name.lower()
                  if lowered in BUNDLED and lowered not in bundled_present:
                      missing_bundled.append((dll, name))

          if bad or missing_bundled:
              if bad:
                  print("::error::Forbidden MinGW runtime dependencies found:")
                  for dll, deps in bad:
                      print(f"  {dll}: {', '.join(deps)}")
              if missing_bundled:
                  print("::error::Bundled runtime dependencies are imported but missing from install output:")
                  for dll, dep in missing_bundled:
                      print(f"  {dll}: {dep}")
              sys.exit(1)

          if BUNDLED & bundled_present:
              print("Bundled runtime dependencies:")
              for name in sorted(BUNDLED & bundled_present):
                  print(f"  {name}")
          else:
              print("No bundled Windows runtime dependencies required.")
          PY
        shell: bash

      # ── UPX (Windows + Linux only) ──
      - name: UPX compress
        if: matrix.upx
        run: |
          find install -type f \( -name "*.dll" -o -name "*.so*" \) | while read f; do
            case "$(basename "$f")" in
              libwinpthread-1.dll)
                echo "Skipping runtime DLL: $f"
                continue
                ;;
            esac
            echo "Compressing: $f"
            upx -9 "$f" 2>/dev/null || echo "  (skipped)"
          done
        shell: bash

      # ── Show sizes ──
      - name: Show sizes
        run: |
          echo "=== Build artifacts ==="
          find install -type f \( -name "*.dll" -o -name "*.dylib" -o -name "*.so*" \) | while read f; do
            size=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f" 2>/dev/null)
            printf "  %-40s %6d bytes\n" "$(basename "$f")" "$size"
          done
        shell: bash

      # ── Package ──
      - name: Package
        run: |
          mkdir -p dist/${{ matrix.target }}
          find install -type f \( -name "*.dll" -o -name "*.dylib" -o -name "*.so" -o -name "*.so.*" -o -name "*eac3_jni*" -o -name "*video_jni*" \) ! -name "*.h" | while read f; do
            cp "$f" dist/${{ matrix.target }}/
          done
          find install -type l -name "*.so*" | while read f; do
            cp -P "$f" dist/${{ matrix.target }}/ 2>/dev/null || true
          done

          # GitHub release archives preserve symlinks, but mod JAR resources and
          # Windows-side manual copying usually do not. Also materialize Linux
          # SONAME filenames as real files so Java System.load("libavutil.so.60")
          # and ELF DT_NEEDED lookups both work after copying into resources.
          if [ "${{ runner.os }}" = "Linux" ]; then
            for soname in libavutil.so.60 libswresample.so.6 libswscale.so.9 libavcodec.so.62; do
              target="$(readlink "install/lib/$soname" 2>/dev/null || true)"
              if [ -n "$target" ] && [ -f "install/lib/$target" ]; then
                cp "install/lib/$target" "dist/${{ matrix.target }}/$soname"
              elif [ -f "install/lib/$soname" ]; then
                cp "install/lib/$soname" "dist/${{ matrix.target }}/$soname"
              else
                echo "::error::Missing Linux SONAME file: $soname"
                find install/lib -maxdepth 1 -name 'libav*.so*' -o -name 'libsw*.so*'
                exit 1
              fi
            done
          fi

          tar czf ffmpeg-media-${{ matrix.target }}.tar.gz -C dist ${{ matrix.target }}
        shell: bash

      # ── Upload artifacts ──
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-media-${{ matrix.target }}
          path: ffmpeg-media-${{ matrix.target }}.tar.gz

  # ── Create release on tag ──
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ffmpeg-media-*
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.tar.gz
          fail_on_unmatched_files: true
